server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # cleanUrls: /10/Foo → /10/Foo.html
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  error_page 404 /404.html;
}
